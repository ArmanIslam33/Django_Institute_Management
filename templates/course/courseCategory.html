{% extends 'master/base.html' %}
{% block title %}
  Course Category | Institute Management
{% endblock %}
{% block content %}
  <h1>Coure Category Page</h1>
  <a href="{% url 'add_course_category' %}" class="btn btn-info my-2">Add Category</a>

  <table class="table table-success table-striped">
    <thead>
      <tr>
        <th>SL</th>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for data in datas %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ data.name }}</td>
          <td>
            <a href="{% url 'update_course_category' data.id %}" class="btn btn-success">Update</a>
            <a href="{% url 'delete_course_category' data.id %}" class="btn btn-danger">Delete</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
